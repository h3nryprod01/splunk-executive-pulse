[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["agents", "tests", "spl_copilot", "soc_triage"]
# Integration tests need a live stack (make demo) + langgraph/hypothesis;
# run them explicitly with `pytest tests/integration`.
addopts = "--ignore=tests/integration --ignore=tests/e2e"
